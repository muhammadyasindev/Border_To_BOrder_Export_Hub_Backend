# ==============================================================================
# BORDERGLOW BACKEND — RENDER BLUEPRINT
# ==============================================================================

services:
  - type: web
    name: borderglow-backend-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ATTACHMENT_STORAGE_DIR
        value: ./data/attachments
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: COMPLIANCE_SIGNING_SECRET
        generateValue: true
      - key: ALLOW_PRODUCTION_SEED
        value: "false"
      - key: COOKIE_SAME_SITE
        value: "lax"
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: BorderGlow Support <support@trade.borderglow.com>
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_SECRET
        sync: false
