services:
  - type: web
    name: borderglow-backend-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://border-to-border-export-frontend.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://border-to-border-export-frontend.vercel.app,http://localhost:5173,http://localhost:3000
      - key: COOKIE_SAME_SITE
        value: none
      - key: ATTACHMENT_STORAGE_DIR
        value: ./data/attachments
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: yasinsasoli186@gmail.com
      - key: SMTP_PASS
        value: snmpfykuplxhvsud
      - key: EMAIL_FROM
        value: Border Export Hub Verification <yasinsasoli186@gmail.com>
      - key: RESEND_API_KEY
        sync: false
      - key: ALLOW_PRODUCTION_SEED
        value: "false"
