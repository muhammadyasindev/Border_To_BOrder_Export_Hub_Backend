# ==============================================================================
# BORDERGLOW BACKEND — RENDER BLUEPRINT
# ==============================================================================
databases:
  - name: borderglow-staging-postgres
    databaseName: borderglow_staging
    user: borderglow_user
    plan: starter
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: borderglow-backend-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: borderglow-attachments
      mountPath: /var/data/attachments
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: borderglow-staging-postgres
          property: connectionString
      - key: ATTACHMENT_STORAGE_DIR
        value: /var/data/attachments
      - key: SESSION_SECRET
        generateValue: true
      - key: COMPLIANCE_SIGNING_SECRET
        generateValue: true
      - key: ALLOW_PRODUCTION_SEED
        value: "false"
      - key: COOKIE_SAME_SITE
        value: "lax"
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: BorderGlow Support <support@trade.borderglow.com>
      - key: TURN_SERVER_URL
        sync: false
      - key: TURN_SECRET
        sync: false
